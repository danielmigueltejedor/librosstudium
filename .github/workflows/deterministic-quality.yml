name: Deterministic Quality Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch integrity
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git show --format= --check HEAD
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r enciclopedia-programacion/requirements.txt pytest
      - name: Existing strict academic and unit gates
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q tests/test_release_bundle.py tests/test_release_metadata.py tests/test_technology_layout_parity.py tests/test_flight_cover_provenance.py tests/test_official_course_codes.py tests/test_solution_procedures.py
          python books/mecanica-fluidos/scripts/check_solution_procedures.py
          for cfg in books/*/book.toml; do
            [ -f "$cfg" ] || continue
            slug="$(basename "$(dirname "$cfg")")"
            aerobooks check "$slug" --strict
            aerobooks-ai coverage "$slug" --strict
          done
